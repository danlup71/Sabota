name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime:
          - win-x64
          - linux-x64
          - osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore -r ${{ matrix.runtime }}

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-restore --no-build

      - name: Publish
        run: |
          dotnet publish src/Sabota/Sabota.fsproj \
            -c Release \
            -r ${{ matrix.runtime }} \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=true \
            -o publish/${{ matrix.runtime }}

      - name: Zip artifact
        run: |
          cd publish
          zip -r Sabota-${{ matrix.runtime }}.zip ${{ matrix.runtime }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sabota-${{ matrix.runtime }}
          path: publish/Sabota-${{ matrix.runtime }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip